{% extends "admin/base_site.html" %}
{% block content %}
<div id="content-main">
  <h2>{{ title }}</h2>
  <form action="" method="post" enctype="multipart/form-data" style="margin-top: 20px;">
    {% csrf_token %}
    <div style="background: #f8f8f8; padding: 15px; border: 1px solid #ddd; margin-bottom: 20px; border-radius: 4px;">
      {{ form.as_p }}
    </div>
    <div>
      <input type="submit" value="Subir e Importar CSV" class="default" style="background: #417690; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px;">
      <a href="../" style="margin-left: 15px; text-decoration: none; color: #666;">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
